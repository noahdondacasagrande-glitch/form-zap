<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Whatsap</title>
</head>
<body>
    <nav>
        <img src="../icons/whatsapp.png" alt="whatsapp" width="30px" height="auto">        
        <h1>Whatsap</h1>
    </nav>
    <main>
        <div class="mensagem">
            <p>Olá! Insira seus dados para ser direcionado para o Whatsapp</p>
        </div>
        <div>
            <h3>Seu nome</h3>
            <label for="nome"></label>
            <input type="text" placeholder="Digite seu nome" id="nome">
        </div>
        <div>
            <h3>Seu e-mail</h3>
            <label for="e-mail"></label>
            <input type="text" placeholder="exemplo@gmail.com" id="e-mail">
        </div>
        <div>
            <h3>Seu Whatsapp</h3>
            <label for="Whatsapp"></label>
            <input type="text" placeholder="+55(88) 98888-8888" id="Whatsapp">
        </div>
        <div>
            <button>Ir para o Whatsapp</button>
        </div>
    </main>
    <footer>
        <h4>Powered by Agender</h4>
    </footer>

    <script src="script.js"></script>
</body>
</html>
