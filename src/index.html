<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Whatsapp</title>
</head>
<body>

    <main>
        <nav class="nav">
            <img src="../icons/whatsapp.png" alt="whatsapp" width="20px" height="auto">        
            <h1>Whatsapp</h1>
        </nav>
        <div class="mensagem">
            <p>Olá! Insira seus dados para ser direcionado para o Whatsapp:</p>
        </div>
        <div>
            <h3>Seu nome</h3>
            <label for="nome"></label>
            <input type="text" placeholder="  Digite seu nome" id="nome">
        </div>
        <div>
            <h3>Seu e-mail</h3>
            <label for="e-mail"></label>
            <input type="text" placeholder="  exemplo@gmail.com" id="email">
        </div>
        <div>
            <h3>Seu Whatsapp</h3>
            <label for="whatsapp"></label>
            <input type="text" placeholder="  +55(88) 98888-8888" id="contato">
        </div>
        <div>
            <button type="button" onclick="mandar()">Ir para o Whatsapp</button>
        </div>
        <footer>
            <h4>Powered by Agender</h4>
        </footer>
    </main>
    <footer>


    <script src="script.js"></script>
</body>
</html>
